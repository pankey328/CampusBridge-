<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Startup Gradient: Amethyst to Sunset Coral -->
    <linearGradient id="nexusGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>

  <!-- The Platform Foundation (Adapts to dark/light themes via CSS if inline, or defaults to dark slate) -->
  <path 
    d="M 15 75 L 105 75" 
    stroke="currentColor" 
    stroke-width="12" 
    stroke-linecap="round" 
    opacity="0.8" 
  />

  <!-- The AI Data Arc (The Bridge) -->
  <path 
    d="M 25 95 C 25 35, 95 35, 95 95" 
    stroke="url(#nexusGrad)" 
    stroke-width="14" 
    stroke-linecap="round" 
  />

  <!-- The Nexus Core (AI Engine) -->
  <circle cx="60" cy="35" r="12" fill="#F43F5E" />
  
  <!-- Inner Glow/Cutout for the Core -->
  <circle cx="60" cy="35" r="4" fill="#FFFFFF" opacity="0.9" />
</svg>
